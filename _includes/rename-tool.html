<div class="intro"><div><h2 id="rename-title">批量改名</h2></div></div>
<div class="office-flow">
  <div class="drop office-file-drop" id="rename-files-drop">
    <label for="rename-files"><span class="step">1</span> 選擇或拖入檔案</label>
    <input type="file" id="rename-files" multiple>
  </div>
  <h3><span class="step">2</span> 選擇檔名格式</h3>
  <div class="fields">
    <label>命名排列
      <select id="rename-format">
        <option value="date-first">20261116 14 32 08_名稱</option>
        <option value="name-first">名稱(261116 143208)</option>
        <option value="sortable">20261116_143208_名稱</option>
      </select>
    </label>
    <label>名稱 <input type="text" id="rename-name" maxlength="120" placeholder="留空沿用原檔名"></label>
  </div>
  <details class="office-advanced"><summary>日期、時間及其他命名設定</summary>
  <div class="fields">
    <label>日期格式
      <select id="rename-date">
        <option value="compact">YYYYMMDD</option>
        <option value="short">YYMMDD</option>
        <option value="iso">YYYY-MM-DD</option>
        <option value="dot">YYYY.MM.DD</option>
        <option value="dmy">DD-MM-YYYY</option>
        <option value="none">不加日期</option>
      </select>
    </label>
    <label>時間格式
      <select id="rename-clock">
        <option value="h m s">HH MM SS</option>
        <option value="hms">HHMMSS</option>
        <option value="h-m-s">HH-MM-SS</option>
        <option value="hm">HHMM</option>
        <option value="h-m">HH-MM</option>
        <option value="none">不加時間</option>
      </select>
    </label>
    <label>時間來源
      <select id="rename-source">
        <option value="auto">優先用 EXIF 拍攝時間</option>
        <option value="modified">檔案修改時間</option>
        <option value="custom">全批使用自訂日期及時間</option>
      </select>
    </label>
  </div>
  <div class="fields">
    <label>時間偏移（分鐘，先於覆蓋套用）
      <input type="number" id="rename-offset" step="1" min="-525600" max="525600" value="0">
    </label>
    <label>全批覆蓋
      <select id="rename-override"><option value="none">保留所選時間</option><option value="date">只改日期</option><option value="clock">只改鐘點</option></select>
    </label>
    <label>流水號
      <select id="rename-sequence"><option value="none">不加</option><option value="selection">按選檔次序</option><option value="name">按原檔名排序</option></select>
    </label>
  </div>
  <div class="fields" id="rename-custom" hidden>
    <label>自訂日期 <input type="date" id="rename-custom-date"></label>
    <label>自訂時間 <input type="time" id="rename-custom-time" step="1" value="00:00:00"></label>
  </div>
  <div class="actions">
    <button type="button" id="rename-save-preset">儲存命名預設</button>
    <button type="button" id="rename-load-preset">套用已儲存預設</button>
  </div>
  </details>
  <h3><span class="step">3</span> 預覽及下載</h3>
  <div id="rename-review-options" hidden>
  <label><span><input type="checkbox" id="rename-filter"> 只顯示原先用修改時間的檔案</span></label>
  </div>
  <p id="rename-status" role="status" class="status">選檔後可預覽新檔名。</p>
  <div id="rename-results" class="table-scroll" tabindex="0" aria-label="改名預覽" hidden>
    <table><thead><tr><th scope="col">匯出</th><th scope="col">原檔名</th><th scope="col">新檔名</th><th scope="col">採用時間</th><th scope="col">時間來源</th><th scope="col">逐檔指定時間</th></tr></thead>
    <tbody id="rename-preview"></tbody></table>
  </div>
  <button class="primary" id="rename-export" disabled>下載已改名 ZIP</button>
</div>

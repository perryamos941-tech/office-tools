<div class="intro"><div><h2 id="video-title">影片轉檔及壓縮</h2></div></div>
<div class="office-flow">
  <div class="drop office-file-drop" id="video-file-drop">
    <label for="video-file"><span class="step">1</span> 選擇或拖入影片</label>
    <input type="file" id="video-file" multiple accept=".dav,.mp4,.mov,.mkv,.avi,.webm,video/*">
  </div>
  <h3><span class="step">2</span> 設定輸出</h3>
  <div class="fields">
  <label>處理方式
    <select id="video-mode">
      <option value="compatible">Windows 相容 MP4 · 最高 1080p</option>
      <option value="compress">減少檔案大小 · H.264／AAC，最高 720p</option>
    </select>
  </label>
  <label>巡查日期時間
    <select id="video-stamp-mode">
      <option value="off">不加日期時間</option>
      <option value="fixed">固定顯示拍攝日期時間</option>
      <option value="clock">逐秒更新</option>
    </select>
  </label>
  </div>
  <div id="video-stamp-options" hidden>
    <div class="fields">
      <label>時間顯示
        <select id="video-stamp-zone">
          <option value="hidden">不顯示時區（按香港時間）</option>
          <option value="8">香港（UTC+08:00）</option>
          <option value="9">日本（UTC+09:00）</option>
          <option value="0">UTC（UTC+00:00）</option>
        </select>
      </label>
      <label>顯示位置
        <select id="video-stamp-position">
          <option value="top-right">右上角</option>
          <option value="top-left">左上角</option>
          <option value="bottom-right">右下角</option>
          <option value="bottom-left">左下角</option>
        </select>
      </label>
    </div>
    <details class="office-advanced"><summary>時間戳樣式</summary>
    <div class="fields stamp-style">
      <label>字體
        <select id="video-stamp-font">
          <option value="mono">等寬（巡查記錄）</option>
          <option value="sans">黑體粗字</option>
          <option value="serif">襯線</option>
        </select>
      </label>
      <label>文字顏色 <input type="color" id="video-stamp-color" value="#ffffff"></label>
      <label>底色 <input type="color" id="video-stamp-background" value="#000000"></label>
      <label>字體大小 <output id="video-stamp-size-value">100%</output>
        <input type="range" id="video-stamp-size" min="70" max="140" step="5" value="100">
      </label>
      <label>底色不透明度 <output id="video-stamp-opacity-value">70%</output>
        <input type="range" id="video-stamp-opacity" min="0" max="100" step="5" value="70">
      </label>
      <label><span><input type="checkbox" id="video-stamp-outline"> 加黑色描邊</span></label>
    </div>
    <button type="button" id="video-stamp-style-reset">重設樣式</button>
    </details>
    <div class="actions"><button type="button" id="video-stamp-confirm-all" disabled>一鍵確認可用時間</button></div>
    <p id="video-stamp-review" role="status" class="detail">時間來源有衝突或缺少日期的影片須逐段核對。</p>
  </div>
  <h3><span class="step">3</span> 轉檔及下載</h3>
  <div class="actions">
    <button class="primary" id="video-start" disabled>開始處理</button>
    <button id="video-resume" hidden>繼續剩餘影片</button>
    <button id="video-retry" hidden>只重試失敗項目</button>
    <button id="video-cancel" hidden>取消</button>
    <button id="video-zip" hidden>下載今卷 ZIP</button>
    <button id="video-clear" hidden>清除今卷輸出</button>
  </div>
  <p id="video-status" role="status" class="status">請選擇影片。完成後可逐段下載或下載 ZIP。</p>
  <figure id="video-stamp-preview" class="stamp-preview" hidden>
    <div class="stamp-frame">
      <video id="video-stamp-player" preload="metadata" muted playsinline></video>
      <span id="video-stamp-overlay"></span>
    </div>
    <figcaption id="video-stamp-caption">示意預覽</figcaption>
  </figure>
  <ul id="video-queue" aria-label="轉檔清單"></ul>
</div>
